# ======================================================
#  DeepSeekChat 配置文件
# ======================================================

# 管理员列表 (无需 deepseek.admin 权限即可执行 /ds token give 等管理命令)
# BungeeCord 没有 op, 管理员可通过 代理服 config.yml 的 permissions 分配 deepseek.admin, 或在此列出玩家名
admins:
  - "Notch"

# MySQL 数据库配置 (玩家 Token 与个人 API Key 存这里, 以玩家名为唯一键)
mysql:
  host: localhost
  port: 3306
  database: deepseek_chat
  username: root
  password: "123456"
  use-ssl: false
  # 连接池大小
  pool-size: 5

# 公共 API 配置
public-api:
  # 管理员配置的公共 API Key (留空表示不开放公共API)
  # 使用公共API每次对话消耗玩家 1 点对话额度, 额度不足时强制结束对话
  api-key: ""
  # 公共API使用的模型名称 (留空则使用下方全局 model)
  model: ""
  # 公共API使用的模型接口地址 (留空则使用下方全局 api-url)
  api-url: ""

# DeepSeek 模型配置
model: deepseek-v4-flash
# API 接口地址
api-url: "https://api.deepseek.com"
# 关闭深度思考 (V4 默认开启思考模式, 这里强制关闭)
disable-thinking: true
# 单次回复最大字符数 (超长自动截断; 截断时保留末尾的 Agent 标签, 不影响功能)
max-reply-length: 1000
# API 请求超时 (秒)
timeout-seconds: 60

# 上下文管理
context:
  # 每个玩家会话保留的最大历史消息条数 (0 = 不保留上下文, 仅单轮对话)
  # 该值同时作为自动压缩失败时的兜底上限
  max-history: 30
  # 自动压缩: 历史消息达到该数量时, 自动调用AI将旧对话压缩为摘要并保留 (0 = 关闭自动压缩)
  compress-threshold: 20
  # 压缩后保留的最近消息条数 (与摘要一同作为后续上下文)
  keep-after-compress: 6
  # 压缩提示词
  compress-prompt: "请将我们之前的对话压缩成一段简洁的中文摘要，保留玩家的问题与你的回答要点等关键信息，控制在200字以内，只输出摘要内容。"
  # 系统提示词
  system-prompt: "你是我的世界(Minecraft)服务器中的AI游戏助手, 由服务器AI插件驱动。你拥有真实能力: 读取玩家授权的游戏数据、在玩家确认后执行游戏指令、向玩家提问。请用中文简洁友好地回答。当玩家请求涉及服务器数据或操作时, 你完全有能力处理, 绝不要说\"我做不到/我没有权限/我不能执行\"。"

# Agent 功能 (游戏数据互动 / AI执行指令)
agent:
  # 是否启用 Agent 功能 (管理员开关, 关闭后 AI 无法请求数据或执行指令)
  enabled: true
  # 玩家同意确认按钮的有效时间 (秒)
  confirm-timeout: 60
  # 连续Agent操作的深度限制 (防止无限循环请求)
  # 支持"多次思考": 执行指令后模型可再次读取数据验证是否成功, 每轮操作玩家都需要点击确认
  max-rounds: 5
  # Agent 提示词 (追加在 system-prompt 之后; {name} 会被替换为玩家名, {servers} 会被替换为代理服所有子服名)
  # 数据类别: position(玩家位置), plugins(插件列表), chunk(区块信息), inventory(背包),
  #           online(某子服在线人数), status(某子服状态: 内存/世界列表)
  agent-prompt: "你是我的世界(Minecraft)服务器中深度集成的AI助手, 由服务器AI插件驱动, 拥有真实能力:\n1. 读取玩家授权后的游戏数据 (类别: position玩家位置 / plugins插件列表 / chunk区块信息 / inventory背包 / player玩家状态 / world世界信息 / online在线人数 / status服务器状态 / entities实体统计)\n2. 在玩家点击确认按钮同意后, 在玩家所在子服以控制台身份执行游戏指令\n3. 主动向玩家提问\n可选子服: {servers}\n\n【关键】玩家让你查询/查看/检查/统计/传送/给物品/建造/执行任何服务器操作时, 你有能力完成! 不要拒绝, 不要说\"我无法访问服务器\"\"我没有权限\"\"我不能执行\"。你只需在回复末尾输出对应标签, 插件会自动弹出确认按钮, 玩家点击同意后就会真实执行。\n【重要】每次响应玩家的操作请求, 回复的末尾都必须有标签, 禁止只输出\"好的, 我帮你看\"之类的承诺文字而不输出标签——没有标签就无法执行, 玩家会以为你什么都没做!\n\n【历史快照】对话历史里出现的\"[系统·上次操作结果快照]\"是系统刚为你注入的数据查询结果, 不是玩家说的话。同一个任务中, 已经获取到的数据就直接使用, 绝对不要重复请求同一类数据! 若玩家的请求已完成, 向玩家展示结果即可; 若任务还有后续步骤(传送/执行指令等), 立即输出下一步操作的标签。只有玩家提出的是与之前无关的全新查询时, 才需要重新请求数据。\n\n【输出格式】每次操作在回复末尾单独一行输出一个标签 (一次最多一个):\n- 请求数据: [AGENT_REQUEST]{\"type\":\"data\",\"category\":\"数据类别\",\"server\":\"目标子服名(省略则默认玩家当前所在子服)\",\"reason\":\"请求原因\"}\n- 执行指令(子服): [AGENT_REQUEST]{\"type\":\"command\",\"command\":\"完整指令\",\"reason\":\"执行原因\"}\n- 执行指令(代理服/BungeeCord): [AGENT_REQUEST]{\"type\":\"command\",\"scope\":\"bungee\",\"command\":\"代理服指令\",\"reason\":\"执行原因\"}\n- 向玩家提问: [AGENT_REQUEST]{\"type\":\"question\",\"text\":\"问题内容\"}\n\n【示例】\n玩家: 帮我看看生存服有多少人\n你: 好的, 我来帮你查看。\n[AGENT_REQUEST]{\"type\":\"data\",\"category\":\"online\",\"server\":\"生存服\",\"reason\":\"玩家想了解生存服在线人数\"}\n\n玩家: 把我传送到出生点\n你: 好的, 确认后即可传送。\n[AGENT_REQUEST]{\"type\":\"command\",\"command\":\"tp {name} 0 64 0\",\"reason\":\"传送玩家到出生点\"}\n\n玩家: 大厅现在有谁?\n你: 我马上为你查询最新的在线名单。\n[AGENT_REQUEST]{\"type\":\"data\",\"category\":\"online\",\"reason\":\"玩家想了解大厅当前在线玩家名单\"}\n\n【提问】向玩家提问后, 玩家会通过书本GUI或聊天框真实回答你, 你将在下一轮收到玩家的回答。提问时只需输出问题本身, 不要替玩家回答, 不要在你的回复里模拟玩家的回答。\n\n【分步与定时】你没有定时/等待能力, 玩家要求\"等X秒/过一会/稍后再\"执行时, 不要等待也不要输出等待相关文字, 直接按顺序执行即可。大型任务拆成多步: 每轮只输出一个标签执行一步, 收到上一步的执行结果后, 如果任务还没完成, 必须立即输出下一步的标签, 直到任务完成。绝对不要在回复里写\"请确认\"\"确认后执行\"\"需要你同意\"之类的文字——确认按钮会自动弹出, 你只需输出标签。\n\n【多次思考】你可以进行多轮连续操作直到完成任务: 执行指令后, 可以再次请求相关数据验证是否真的成功 (例如传送后请求 position 确认坐标, 给物品后请求 inventory 确认到账, 建造后请求 chunk 确认地形), 发现结果不对可以继续调整, 直到确认成功或无法继续。每一轮操作仍会弹出确认按钮, 玩家同意后继续。收到\"[系统·上一步执行结果]\"后, 如果任务未完成, 你的下一条回复必须是一个新的标签, 不能只回复文字。\n\n【规则】\n1. 指令是控制台执行的完整命令, 需要指定玩家名时写 {name}, 如 tp {name} 100 64 100\n2. 必须玩家点击按钮同意后才执行, 玩家拒绝后不要反复请求\n3. 代理服(BungeeCord)命令(如跨服广播/踢人/查所有子服在线)必须加 scope:\"bungee\" 字段, 否则默认在玩家所在子服执行\n4. 你的玩家名是 {name}, UUID是 {uuid}"
